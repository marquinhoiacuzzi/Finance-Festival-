<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
@font-face {
  font-family: 'Phatt';
  src: url('uploads/revive-80-phatt.otf') format('opentype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Breul Grotesk';
  src: url('uploads/breul-grotesk-a-black.ttf') format('truetype');

  font-style: normal;
}
@font-face {
  font-family: 'Breul Grotesk';

}
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#000000;
  --cyan:#00E5FF;
  --purple:#8B31E8;
  --lilac:#C084FC;
  --white:#EEEEF8;
  --dim:#8890A8;
  --navy:#0F1628;
  --border:rgba(0,229,255,0.12);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--white);font-family:'Breul Grotesk',sans-serif;font-weight:300;overflow-x:hidden}
::selection{background:var(--cyan);color:#000}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--purple)}

#tweaks-panel{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:rgba(10,12,22,0.92);border:1px solid var(--border);
  backdrop-filter:blur(20px);border-radius:16px;padding:20px;
  width:260px;display:none;flex-direction:column;gap:14px;
}
#tweaks-panel.visible{display:flex}
.tweak-title{font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.tweak-row{display:flex;flex-direction:column;gap:8px}
.tweak-options{display:flex;gap:6px;flex-wrap:wrap}
.tweak-btn{
  font-family:'Breul Grotesk',sans-serif;font-size:11px;font-weight:500;
  padding:5px 10px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--dim);cursor:pointer;transition:all 0.2s;
}
.tweak-btn.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,0.08)}
.tweak-btn:hover:not(.active){border-color:rgba(0,229,255,0.3);color:var(--white)}

/* ── CURSOR ── */
*{cursor:url('uploads/arrow2699-xs.png'),default!important}
@media(hover:none){*{cursor:auto!important}}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .nav-links{display:flex!important;gap:16px!important}
  .nav-brand-text{display:none!important}
  .nav-cta{display:none!important}
  .about-grid{grid-template-columns:1fr!important;gap:48px!important}
  .cards-grid{grid-template-columns:1fr 1fr!important}
  .section-pad{padding:80px 24px!important}
  .contact-row{flex-direction:column!important;gap:32px!important}
  .footer-row{flex-direction:column!important;gap:8px!important;text-align:center!important}
  .split-grid{grid-template-columns:1fr!important}
  .split-right{display:none!important}
  .typo-bottom{gap:24px!important;flex-direction:column!important;align-items:flex-start!important}
  #tweaks-panel{width:calc(100vw - 32px)!important;right:16px!important;bottom:16px!important}
}
@media(max-width:480px){

  .section-pad{padding:64px 20px!important}

}

@keyframes orbFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(3%,4%) scale(1.05)}}
@keyframes ringPulseA{0%,100%{opacity:0.6;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.03)}}
@keyframes ringPulseB{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.65;transform:translate(-50%,-50%) scale(1.04)}}
@keyframes ringPulseC{0%,100%{opacity:0.15;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.4;transform:translate(-50%,-50%) scale(1.06)}}

<body>
<div id="root"></div>

<script type="text/babel">








const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroVariant": "centered",
  "accentColor": "purple",
  "showGrid": false,
  "navBlur": true
} /*EDITMODE-END*/;

// ─── LOGO ────────────────────────────────────────────────────────
function LogoIcon({ size = 150 }) {
  return (
    <img
      src="uploads/Logo ok.png"
      alt="Finance Festival"
      style={{
        width: size, height: size,
        objectFit: 'contain',
        flexShrink: 0
      }} />);


}

// ─── NEON RINGS (fixed, página completa) ─────────────────────────
function NeonRings({ cyan = true, purple = true, intensity = 1 }) {
  const [scrollFade, setScrollFade] = useState(1);
  useEffect(() => {
    const fn = () => {
      const ratio = Math.min(window.scrollY / (window.innerHeight * 0.8), 1);
      setScrollFade(1 - ratio * 0.72);
    };
    window.addEventListener('scroll', fn, { passive: true });
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const op = intensity * scrollFade;
  return (
    <div style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 0, overflow: 'hidden' }}>
      {/* ── CYAN ring — top-left, mitad afuera ── */}
      {cyan && <>
        <div style={{
          position: 'absolute', top: '-14vw', left: '-14vw',
          width: '30vw', height: '30vw', borderRadius: '50%',
          border: `40px solid rgba(0,229,255,${0.85 * op})`,
          boxShadow: `0 0 60px 30px rgba(0,229,255,${0.55 * op}), 0 0 140px 70px rgba(0,229,255,${0.25 * op}), inset 0 0 50px rgba(0,229,255,${0.35 * op})`,
          filter: `blur(22px)`
        }} />
        {/* Anillo interior blanco */}
        <div style={{
          position: 'absolute', top: '-10vw', left: '-10vw',
          width: '22vw', height: '22vw', borderRadius: '50%',
          border: `16px solid rgba(160,255,255,${1.0 * op})`,
          boxShadow: `0 0 40px 20px rgba(100,255,255,${0.9 * op}), 0 0 80px 30px rgba(0,229,255,${0.5 * op}), inset 0 0 30px rgba(160,255,255,${0.7 * op})`,
          filter: `blur(13px)`
        }} />
        {/* Glow blob suave detrás */}
        <div style={{
          position: 'absolute', top: '-16vw', left: '-16vw',
          width: '36vw', height: '36vw', borderRadius: '50%',
          background: `radial-gradient(circle, rgba(0,229,255,${0.08 * op}) 0%, transparent 65%)`,
          filter: 'blur(70px)'
        }} />
      </>}

      {/* ── PURPLE ring — bottom-right, mitad afuera ── */}
      {purple && <>
        <div style={{
          position: 'absolute', bottom: '-14vw', right: '-14vw',
          width: '30vw', height: '30vw', borderRadius: '50%',
          border: `40px solid rgba(160,0,255,${0.85 * op})`,
          boxShadow: `0 0 60px 30px rgba(160,0,255,${0.55 * op}), 0 0 140px 70px rgba(160,0,255,${0.25 * op}), inset 0 0 50px rgba(160,0,255,${0.35 * op})`,
          filter: `blur(22px)`
        }} />
        {/* Anillo interior blanco */}
        <div style={{
          position: 'absolute', bottom: '-10vw', right: '-10vw',
          width: '22vw', height: '22vw', borderRadius: '50%',
          border: `16px solid rgba(220,150,255,${1.0 * op})`,
          boxShadow: `0 0 40px 20px rgba(210,130,255,${0.9 * op}), 0 0 80px 30px rgba(160,0,255,${0.5 * op}), inset 0 0 30px rgba(220,150,255,${0.7 * op})`,
          filter: `blur(13px)`
        }} />
        <div style={{
          position: 'absolute', bottom: '-16vw', right: '-16vw',
          width: '36vw', height: '36vw', borderRadius: '50%',
          background: `radial-gradient(circle, rgba(160,0,255,${0.08 * op}) 0%, transparent 65%)`,
          filter: 'blur(70px)'
        }} />
      </>}
    </div>);

}

// ─── GRID ────────────────────────────────────────────────────────
function GridOverlay({ visible }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none',
      backgroundImage: `linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px)`,
      backgroundSize: '60px 60px'
    }} />);

}

// ─── NAV ─────────────────────────────────────────────────────────
function Nav({ blur }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 40);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      padding: '0 24px', height: 64,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      background: scrolled ? blur ? 'rgba(6,7,13,0.85)' : 'rgba(6,7,13,0.98)' : 'transparent',
      backdropFilter: scrolled && blur ? 'blur(20px)' : 'none',
      borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
      transition: 'all 0.4s ease'
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
        <LogoIcon size={28} glow={false} />
        <span className="nav-brand-text" style={{ fontFamily: 'Phatt', fontSize: 18, letterSpacing: '0.08em' }}>FINANCE FESTIVAL</span>
      </div>
      <div className="nav-links" style={{ display: 'flex', gap: 32, alignItems: 'center' }}>
        {[['¿Qué es?', 'about'], ['Agenda', 'agenda'], ['Contacto', 'contacto']].map(([l, id]) =>
        <a key={l} href={`#${id}`} style={{ color: 'var(--dim)', fontSize: 13, fontWeight: 500, textDecoration: 'none', letterSpacing: '0.02em', transition: 'color 0.2s' }}
        onMouseEnter={(e) => e.target.style.color = 'var(--cyan)'}
        onMouseLeave={(e) => e.target.style.color = 'var(--dim)'}>{l}</a>
        )}
        <button style={{
          fontFamily: 'Breul Grotesk', fontSize: 13, fontWeight: 600,
          padding: '8px 20px', borderRadius: 8,
          background: 'transparent', border: '1px solid var(--cyan)',
          color: 'var(--cyan)', cursor: 'pointer', letterSpacing: '0.04em', transition: 'all 0.2s'
        }}
        onMouseEnter={(e) => e.currentTarget.style.background = 'rgba(0,229,255,0.1)'}
        onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
          INSCRIBIRME
        </button>
      </div>
    </nav>);

}

// ─── COUNTDOWN ───────────────────────────────────────────────────
function Countdown() {
  const target = new Date('2026-08-08T09:00:00');
  const calc = () => {
    const diff = target - new Date();
    if (diff <= 0) return { d: 0, h: 0, m: 0, s: 0 };
    return {
      d: Math.floor(diff / 86400000),
      h: Math.floor(diff % 86400000 / 3600000),
      m: Math.floor(diff % 3600000 / 60000),
      s: Math.floor(diff % 60000 / 1000)
    };
  };
  const [t, setT] = useState(calc);
  useEffect(() => {const i = setInterval(() => setT(calc()), 1000);return () => clearInterval(i);}, []);
  const pad = (n) => String(n).padStart(2, '0');
  const units = [['días', t.d], ['hrs', t.h], ['min', t.m], ['seg', t.s]];
  return (
    <div style={{ display: 'flex', gap: 8, alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap' }}>
      {units.map(([label, val], i) =>
      <React.Fragment key={label}>
          <div style={{ textAlign: 'center' }}>
            <div style={{ fontFamily: 'Breul Grotesk', fontWeight: 700, fontSize: 28, lineHeight: 1, color: 'var(--cyan)', letterSpacing: '0.06em' }}>{pad(val)}</div>
            <div style={{ fontSize: 9, fontWeight: 600, letterSpacing: '0.15em', color: 'var(--dim)', textTransform: 'uppercase', marginTop: 2 }}>{label}</div>
          </div>
          {i < 3 && <div style={{ color: 'var(--dim)', fontFamily: 'Breul Grotesk', fontSize: 24, paddingBottom: 12 }}>:</div>}
        </React.Fragment>
      )}
    </div>);

}

// ─── HERO V1: CENTERED ───────────────────────────────────────────
function HeroCentered() {
  return (
    <section style={{ position: 'relative', minHeight: '100vh', display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', textAlign: 'center', padding: '80px 24px 60px' }}>
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 24 }}>
        <LogoIcon size={96} />
        <div style={{ fontFamily: 'Phatt', fontSize: 'clamp(32px, 10vw, 140px)',
          lineHeight: 0.9, letterSpacing: '0.04em', color: 'var(--white)',
          textShadow: '0 0 80px rgba(0,229,255,0.15)' }}>
          FINANCE<br />FESTIVAL
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, color: 'var(--dim)', fontSize: 14, fontWeight: 400, letterSpacing: '0.08em' }}>
          <span>SAB 8 AGO 2026</span>
          <span style={{ width: 3, height: 3, borderRadius: '50%', background: 'var(--dim)', display: 'inline-block' }} />
          <span>PARQUE DE LA INNOVACIÓN</span>
        </div>
        <div style={{ width: '100%', maxWidth: 320, padding: '16px 0', borderTop: '1px solid var(--border)', borderBottom: '1px solid var(--border)' }}>
          <div style={{ fontSize: 10, letterSpacing: '0.18em', color: 'var(--dim)', textTransform: 'uppercase', marginBottom: 10, fontWeight: 600 }}>Faltan</div>
          <Countdown />
        </div>
        <button style={{
          fontFamily: 'Breul Grotesk', fontSize: 14, fontWeight: 700,
          padding: '14px 40px', borderRadius: 10,
          backgroundColor: 'var(--purple)', color: '#fff', border: 'none',
          cursor: 'pointer', letterSpacing: '0.06em', textTransform: 'uppercase',
          boxShadow: '0 0 40px rgba(139,49,232,0.4)', transition: 'background-color 0.25s, color 0.25s, box-shadow 0.25s, transform 0.25s'
        }}
        onMouseEnter={(e) => {e.currentTarget.style.transform = 'translateY(-2px)';e.currentTarget.style.backgroundColor = '#00E5FF';e.currentTarget.style.color = '#000';e.currentTarget.style.boxShadow = '0 0 60px rgba(0,229,255,0.6)';}}
        onMouseLeave={(e) => {e.currentTarget.style.transform = 'none';e.currentTarget.style.backgroundColor = '#8B31E8';e.currentTarget.style.color = '#fff';e.currentTarget.style.boxShadow = '0 0 40px rgba(139,49,232,0.4)';}}>
          QUIERO INSCRIBIRME
        </button>
        <p style={{ fontSize: 12, color: 'var(--dim)', letterSpacing: '0.04em' }}>Las inscripciones abren pronto</p>
      </div>
    </section>);

}

// ─── HERO V2: SPLIT ──────────────────────────────────────────────
function HeroSplit() {
  return (
    <section className="split-grid" style={{ position: 'relative', minHeight: '100vh', display: 'grid',
      gridTemplateColumns: '1fr 1fr', overflow: 'hidden' }}>
      <div style={{
        position: 'absolute', top: 0, bottom: 0, left: '50%',

        transform: 'skewX(-8deg)', zIndex: 2,
        boxShadow: '0 0 20px rgba(0,229,255,0.4)'
      }} />
      <div style={{ position: 'relative', zIndex: 3, display: 'flex', flexDirection: 'column',
        justifyContent: 'center', padding: '120px 60px 60px 60px' }}>
        <div style={{ fontSize: 12, letterSpacing: '0.2em', color: 'var(--cyan)', fontWeight: 600, marginBottom: 16 }}>
          SAB 8 AGO 2026 · PARQUE DE LA INNOVACIÓN
        </div>
        <div style={{ fontFamily: 'Phatt', fontSize: 'clamp(56px, 7vw, 108px)',
          lineHeight: 0.88, letterSpacing: '0.03em', color: 'var(--white)', marginBottom: 32 }}>
          FINANCE<br />FESTIVAL
        </div>
        <p style={{ fontSize: 16, color: 'var(--dim)', lineHeight: 1.6, maxWidth: 380, marginBottom: 40 }}>
          Finanzas tradicionales y descentralizadas.<br />
          Talleres, charlas, networking y mucho más.
        </p>
        <div style={{ marginBottom: 32, maxWidth: 300 }}><Countdown /></div>
        <button style={{
          fontFamily: 'Breul Grotesk', fontSize: 14, fontWeight: 700,
          padding: '14px 40px', borderRadius: 10, width: 'fit-content',
          background: 'var(--purple)', color: '#fff', border: 'none',
          cursor: 'pointer', letterSpacing: '0.06em', textTransform: 'uppercase',
          boxShadow: '0 0 40px rgba(139,49,232,0.4)', transition: 'all 0.25s'
        }}
        onMouseEnter={(e) => e.currentTarget.style.transform = 'translateY(-2px)'}
        onMouseLeave={(e) => e.currentTarget.style.transform = 'none'}>
          QUIERO INSCRIBIRME
        </button>
      </div>
      <div className="split-right" style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <LogoIcon size={200} glow={true} />
      </div>
    </section>);

}

// ─── HERO V3: TYPOGRAPHIC ────────────────────────────────────────
function HeroTypo() {
  return (
    <section style={{ position: 'relative', minHeight: '100vh', display: 'flex',
      flexDirection: 'column', justifyContent: 'flex-end', padding: '0 48px 80px', overflow: 'hidden' }}>
      <div style={{

      }}>

      </div>
      <div style={{ position: 'relative', zIndex: 2, display: 'flex', gap: 60, alignItems: 'flex-end', flexWrap: 'wrap' }}>

}

// ─── ABOUT ───────────────────────────────────────────────────────
function About() {

  return (
    <section id="about" className="section-pad" style={{ position: 'relative', padding: '120px 60px', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', top: '30%', left: '-10%', width: '40vw', height: '40vw', borderRadius: '50%',
        background: 'radial-gradient(circle, rgba(139,49,232,0.1) 0%, transparent 65%)', pointerEvents: 'none' }} />
      <div style={{ maxWidth: 800, margin: '0 auto', position: 'relative', zIndex: 1 }}>
        <div style={{ fontSize: 11, letterSpacing: '0.2em', color: 'var(--cyan)', fontWeight: 600, marginBottom: 16, textTransform: 'uppercase' }}>Sobre el evento</div>
        <h2 style={{ fontFamily: 'Breul Grotesk', fontWeight: 700, fontSize: 'clamp(40px, 5vw, 72px)', lineHeight: 0.9,
          letterSpacing: '0.03em', marginBottom: 32, color: 'var(--white)' }}>
          ¿QUÉ ES EL<br /><span style={{ fontFamily: 'Phatt' }}>FINANCE FESTIVAL</span>?
        </h2>
        <p style={{ fontSize: 18, color: 'var(--dim)', lineHeight: 1.75, marginBottom: 16 }}>
          El Finance Festival es un <span style={{ color: 'var(--white)' }}>evento masivo</span> para descubrir el mundo de las finanzas tradicionales y las criptomonedas de forma práctica y entretenida.
        </p>
        <p style={{ fontSize: 18, color: 'var(--dim)', lineHeight: 1.75, marginBottom: 48 }}>
          Los participantes podrán asistir a charlas, participar en talleres, explorar stands y hacer networking.
        </p>

        {/* Video — thumbnail clicable */}
        <a
          href="https://www.youtube.com/watch?v=q9UNZG_QMwU"
          target="_blank"
          rel="noopener noreferrer"
          onClick={(e) => {
            // Forzar nueva pestaña incluso si estamos dentro de un iframe (preview)
            e.preventDefault();
            window.open('https://www.youtube.com/watch?v=q9UNZG_QMwU', '_blank', 'noopener,noreferrer');
          }}
          style={{ display: 'block', textDecoration: 'none' }}>
          
          <div style={{
            position: 'relative', width: '100%', paddingBottom: '56.25%',
            borderRadius: 16, overflow: 'hidden',
            border: '1px solid var(--border)',
            boxShadow: '0 0 60px rgba(0,229,255,0.08)',
            cursor: 'pointer'
          }}
          onMouseEnter={(e) => {
            e.currentTarget.style.boxShadow = '0 0 80px rgba(0,229,255,0.22)';

// ─── TWEAKS ──────────────────────────────────────────────────────
function TweaksPanel({ tweaks, onChange }) {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);
  const set = (key, val) => {
    const next = { ...tweaks, [key]: val };
    onChange(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  return (
    <div id="tweaks-panel" className={visible ? 'visible' : ''}>
      <div style={{ fontSize: 13, fontWeight: 700, color: 'var(--white)', letterSpacing: '0.04em', borderBottom: '1px solid var(--border)', paddingBottom: 12 }}>Tweaks</div>
      <div className="tweak-row">
        <div className="tweak-title">Variante del Hero</div>
        <div className="tweak-options">
          {[['centered', 'Centrado'], ['split', 'Split'], ['typo', 'Tipográfico']].map(([v, l]) =>
          <button key={v} className={`tweak-btn ${tweaks.heroVariant === v ? 'active' : ''}`} onClick={() => set('heroVariant', v)}>{l}</button>
          )}
        </div>
      </div>
      <div className="tweak-row">
        <div className="tweak-title">Color de acento</div>
        <div className="tweak-options">
          {[['cyan', 'Cyan'], ['purple', 'Púrpura'], ['teal', 'Teal']].map(([v, l]) =>
          <button key={v} className={`tweak-btn ${tweaks.accentColor === v ? 'active' : ''}`} onClick={() => set('accentColor', v)}>{l}</button>
          )}
        </div>
      </div>
      <div className="tweak-row">
        <div className="tweak-title">Grilla de fondo</div>
        <div className="tweak-options">
          <button className={`tweak-btn ${tweaks.showGrid ? 'active' : ''}`} onClick={() => set('showGrid', !tweaks.showGrid)}>
            {tweaks.showGrid ? 'Visible' : 'Oculta'}
          </button>
        </div>
      </div>
      <div className="tweak-row">
        <div className="tweak-title">Nav blur</div>
        <div className="tweak-options">
          <button className={`tweak-btn ${tweaks.navBlur ? 'active' : ''}`} onClick={() => set('navBlur', !tweaks.navBlur)}>
            {tweaks.navBlur ? 'Activado' : 'Desactivado'}
          </button>
        </div>
      </div>
    </div>);

}

// ─── APP ─────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweaks] = useState(() => {
    try {return { ...TWEAK_DEFAULTS, ...JSON.parse(localStorage.getItem('ff-tweaks') || '{}') };}
    catch {return TWEAK_DEFAULTS;}
  });
  useEffect(() => {
    localStorage.setItem('ff-tweaks', JSON.stringify(tweaks));
    const c = tweaks.accentColor === 'purple' ? '#8B31E8' : tweaks.accentColor === 'teal' ? '#0ACDCD' : '#00E5FF';
    document.documentElement.style.setProperty('--cyan', c);
  }, [tweaks]);
  const Hero = tweaks.heroVariant === 'split' ? HeroSplit : tweaks.heroVariant === 'typo' ? HeroTypo : HeroCentered;
  return (
    <>
      <GridOverlay visible={tweaks.showGrid} />
      <NeonRings intensity={1} />
      <Nav blur={tweaks.navBlur} />
      <Hero />
      <About />
      <Trama />
      <Agenda />
      <Sponsors />
      <Contact />
      <TweaksPanel tweaks={tweaks} onChange={setTweaks} />
    </>);

}
